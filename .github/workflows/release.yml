name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger option

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --release
    
    - name: Build App Bundle
      run: flutter build appbundle --release
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
        body: |
          ## Noor App - نور v${{ github.ref_name }}
          
          ### 📥 Download
          - **APK**: Direct installation on Android devices
          - **AAB**: For Google Play Store submission
          
          ### 🔧 Installation
          1. Download APK file below
          2. Enable "Unknown Sources" in Settings → Security
          3. Open downloaded APK and tap Install
          4. Launch Noor and enjoy!
          
          ### ✨ Features
          - 📚 **Quran Reader**: Complete Quran with Urdu translation
          - 🕊 **Prayer Times**: Accurate timings based on location
          - 📿 **Tasbih Counter**: Digital Dhikr counter
          - 📅 **Schedule Builder**: Custom Islamic routines
          - 🌙 **Ramadan Timer**: Sehri/Iftar countdown
          - 📜 **Hadith & Duas**: Islamic knowledge library
          - 🎮 **Kids Zone**: 219+ educational game levels
          - 🏆 **Leaderboard**: Earn points and compete
          - 🌐 **Multi-language**: 6 languages supported
          
          ### 🔗 Links
          - **Website**: https://noormanual.jo3.org
          - **Backend API**: https://noormanual.jo3.org/health
          - **Report Issues**: In-app Telegram bot
          
          ### 🔒 Privacy
          - No ads, completely free
          - Minimal data collection
          - Privacy policy: https://noormanual.jo3.org/privacy.html
          
          بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحيمِ
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
